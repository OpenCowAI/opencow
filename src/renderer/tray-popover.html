<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenCow Popover</title>
    <script>
      // Prevent FOUC: resolve dark mode before first paint.
      ;(function () {
        try {
          var raw = localStorage.getItem('opencow-theme') || localStorage.getItem('ccboard-theme')
          var cfg = raw ? JSON.parse(raw) : null
          var mode = cfg && cfg.mode ? cfg.mode : 'system'
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage unavailable — fall back to light theme */
        }
      })()
    </script>
  </head>
  <body class="bg-transparent overflow-hidden">
    <div id="root"></div>
    <script type="module" src="./tray-popover-main.tsx"></script>
  </body>
</html>
